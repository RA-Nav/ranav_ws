# FAST-LIO (src/FAST_LIO_SLAM_ROS2/FAST_LIO_ROS2) on the simulated RoboSense Airy of the Aliengo
# (legged_unitree_description/urdf/common/robosense_airy.xacro, mounted in urdf/robot.xacro).
#
# The Airy is pitched 5 deg forward, so imu_R rotates the IMU readings into a frame with the base orientation (the
# rslidar_joint rotation, rpy="0 5deg 0"). FAST-LIO then estimates that upright frame: camera_init, /Odometry and
# /cloud_registered_body are gravity-aligned when the robot starts level. The IMU sits at the rslidar origin and
# /rslidar_points is in rslidar, so the lidar->body extrinsic is the same rotation with zero translation.
# Keep imu_R and extrinsic_R in sync with the mount in robot.xacro: both are Ry(pitch) = [c 0 s; 0 1 0; -s 0 c]
# (15 deg until 2026-10-13, then the identity for a few hours, then 5 deg).
# This is the Airy on the front of the trunk. The one in the slam box (robot.xacro slam_box:=true):
# fast_lio_slam_launch.xml slam_box:=true lays fast_lio_airy_slam_box.yaml (its body_in_base) over this file.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 4              # every 4th of the 900 columns: 21600 of the 86400 points per scan go to
                                         # FAST-LIO and on to /cloud_registered (terrain, TARE, SC-PGO keyframes, map)
        max_iteration: 3
        filter_size_surf: 0.3
        filter_size_map: 0.3
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: ""

        common:
            lid_topic: "/rslidar_points"
            imu_topic: "/rslidar_imu_data"
            lid_reliable: true           # the 900 x 96 clouds are over 2 MB: best effort loses a third of them
            body_frame: "rslidar_lio"    # not rslidar: that one is already in the URDF TF tree
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            # Not 1-4 (Livox, Velodyne, Ouster, MID360): the default handler reads plain x y z intensity, skips
            # the NaN no-return points and applies no per-point motion compensation, right for the
            # instantaneous Gazebo scans
            lidar_type: 5
            scan_line: 96
            blind: 0.1                   # Airy blind zone; the legs are out of view of the top mount
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 60.0              # Airy max range
            extrinsic_est_en: false      # exact in simulation
            extrinsic_T: [0.0, 0.0, 0.0]
            extrinsic_R: [0.996195, 0.0, 0.087156,
                          0.0,      1.0, 0.0,
                          -0.087156, 0.0, 0.996195]
            imu_R: [0.996195, 0.0, 0.087156,
                    0.0,      1.0, 0.0,
                    -0.087156, 0.0, 0.996195]

        publish:
            path_en: true
            effect_map_en: false
            # /Laser_map off: FAST-LIO appends the last scan to it every second and never clears it, so it grows by
            # ~1 MB/s for the whole session, all republished each time. The map in rviz is SC-PGO's /aft_pgo_map.
            map_en: false
            scan_publish_en: true
            dense_publish_en: true
            scan_bodyframe_pub_en: true  # SC-PGO keyframes

        pcd_save:
            pcd_save_en: false
            interval: -1

        # Joins FAST-LIO to the robot TF tree (fast_lio_slam_launch.xml):
        #   odom -> lio_map -> camera_init -> rslidar_lio -> lio_base, camera_init -> map
        frames:
            map_frame: "lio_map"         # the base when FAST-LIO started
            base_frame: "lio_base"       # the base FAST-LIO estimates
            body_in_base: [0.2835, 0.0, 0.066]   # lidar_mount_x, 0, lidar_mount_z of robot.xacro (Aliengo)
            init_aliases: ["map"]        # terrainAnalysis(Ext) stamp their camera_init points "map"
            base_odom_topic: "/lio_base_odometry"   # /Odometry at the base: TARE, tare_finish_merge_map.py

        # odom -> lio_map, re-set on every /Odometry so that lio_base lands on base of the legged estimator
        alignment:
            odom_topic: "/odom"
            odom_frame: "odom"
            max_stamp_gap: 0.05
